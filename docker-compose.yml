# jt-live-whisper ── docker compose（伺服器版）
#
#   docker compose up -d --build
#   瀏覽器開啟 http://localhost:19781
#
# 離線音檔處理（WebUI 上傳 / ./start.sh --input）正常運作。
# 即時系統音訊擷取（Linux）：把主機的 PipeWire/PulseAudio socket 掛進容器即可（見 volumes）。

services:
  jt-live-whisper:
    build:
      context: .
      args:
        # CPU（預設）。要做 CUDA 版改成 https://download.pytorch.org/whl/cu124，
        # 並啟用下面的 GPU 區塊，再執行 `docker compose up -d --build`。
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    image: jt-live-whisper:latest
    container_name: jt-live-whisper
    restart: unless-stopped

    # 用 host 網路，讓本機瀏覽器（127.0.0.1）被視為本機、取得完整權限。
    # 若改成 -p 發布埠，連線會經 Docker NAT，容器看到的是 bridge 閘道而非 127.0.0.1，
    # WebUI 會變成「唯讀模式」；那樣就必須設定下面的密碼。
    # 注意 --network host 下不需要 ports:，WebUI 直接綁在主機的 19781。
    network_mode: host

    environment:
      # 可連線的來源網段（逗號分隔，支援 CIDR）。留空＝不限制；本機一律放行。
      JTLW_WEBUI_ALLOWED_IPS: ""
      # 首次啟動時設定 WebUI 密碼（只存 sha256）。設定後遠端就需要密碼。
      # JTLW_WEBUI_READ_PASSWORD: "change-me"
      # JTLW_WEBUI_ADMIN_PASSWORD: "change-me"
      # 即時系統音訊用（Linux）：指向主機的 PipeWire/PulseAudio
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
      PULSE_SERVER: unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native

    volumes:
      # 設定、錄音、紀錄（持久化）
      - jtlw-data:/data
      # 模型快取（映像已烘入，這裡只是避免升級容器時重新下載）
      - jtlw-hf:/root/.cache/huggingface
      - jtlw-share:/root/.local/share
      # 即時系統音訊（Linux）：主機的 PulseAudio/PipeWire socket 與 cookie。
      # 不需要即時模式時可以刪掉這三行，改成 -p 發布埠或維持 host 網路皆可。
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro

    # GPU（選配）：需先安裝 NVIDIA 驅動 + nvidia-container-toolkit，並用
    # CUDA 版建置（上面的 TORCH_INDEX_URL 改成 cu124）。之後啟用以下區塊：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  jtlw-data:
  jtlw-hf:
  jtlw-share:
